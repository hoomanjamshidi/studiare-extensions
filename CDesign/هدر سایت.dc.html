<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..900&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#F4F5F7; }
  a { color:#3E4950; text-decoration:none; }
  a:hover { color:#D68800; }
</style>
</helmet>

<div dir="rtl" style="font-family:Vazirmatn, system-ui, sans-serif; background:#F4F5F7; color:#171C1F; min-height:100vh">

  <header style="background:#FFFFFF; box-shadow:0 8px 24px -20px rgba(23,28,31,0.5)">

    <div style="max-width:1440px; margin:0 auto; padding:14px 26px; display:flex; align-items:center; gap:20px; flex-wrap:wrap">

      <span style="width:44px; height:44px; border-radius:14px; background:#F8B000; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; flex-shrink:0">ب</span>

      <span style="display:flex; align-items:center; gap:9px; font-size:15px; font-weight:800; color:#171C1F; cursor:pointer; flex-shrink:0" style-hover="color:#D68800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#6B8090"><circle cx="5" cy="5" r="1.8"></circle><circle cx="12" cy="5" r="1.8"></circle><circle cx="19" cy="5" r="1.8"></circle><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle><circle cx="5" cy="19" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle><circle cx="19" cy="19" r="1.8"></circle></svg>
        دسته‌بندی‌ها
      </span>

      <label style="flex:1; min-width:220px; display:flex; align-items:center; gap:10px; background:#FFFFFF; border:1px solid #DCE1E4; border-radius:12px; padding:0 14px; height:46px" style-focus="border-color:#F8B000">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA8B2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
        <input placeholder="جست‌وجو در برتراندیش" style="flex:1; min-width:0; border:none; outline:none; background:transparent; font-family:Vazirmatn, sans-serif; font-size:14px; color:#171C1F" />
      </label>

      <nav style="display:flex; align-items:center; gap:6px; flex-wrap:wrap">
        <a href="#" style="display:flex; align-items:center; gap:8px; border:1.5px solid #F8B000; color:#B37200; font-size:14.5px; font-weight:700; padding:11px 18px; border-radius:12px; white-space:nowrap" style-hover="background:#FFF5DE; color:#B37200">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F8B000" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
          مسیرهای یادگیری
        </a>
        <a href="#" style="font-size:14.5px; font-weight:600; color:#3E4950; padding:11px 14px; border-radius:12px; white-space:nowrap" style-hover="color:#D68800; background:#F4F5F7">وبلاگ</a>
        <a href="#" style="font-size:14.5px; font-weight:600; color:#3E4950; padding:11px 14px; border-radius:12px; white-space:nowrap" style-hover="color:#D68800; background:#F4F5F7">تماس با ما</a>
      </nav>

      <span style="flex:1"></span>

      <div style="display:flex; align-items:center; gap:10px; flex-shrink:0">

        <span style="position:relative; display:flex">
          <span style="width:46px; height:46px; border-radius:14px; background:#F4F5F7; display:flex; align-items:center; justify-content:center; cursor:pointer" style-hover="background:#EEF0F2">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3E4950" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2H6.2z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
          </span>
          <span style="position:absolute; top:-4px; left:-4px; min-width:19px; height:19px; padding:0 5px; border-radius:999px; background:#3E4950; color:#FFFFFF; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center">۰</span>
        </span>

        <span style="position:relative; display:flex">
          <span style="width:46px; height:46px; border-radius:14px; background:#FFF5DE; display:flex; align-items:center; justify-content:center; cursor:pointer" style-hover="background:#FFE9B8">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#B37200" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15V10a6 6 0 1 0-12 0v5l-1.6 2.4h15.2z"></path><path d="M10 20.2a2.4 2.4 0 0 0 4 0"></path></svg>
          </span>
          <span style="position:absolute; top:-4px; left:-4px; min-width:19px; height:19px; padding:0 5px; border-radius:999px; background:#D64B4B; color:#FFFFFF; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center">۳</span>
        </span>

        <span style="display:flex; align-items:center; gap:10px; background:#FFF5DE; border-radius:14px; padding:5px 14px 5px 5px; cursor:pointer" style-hover="background:#FFE9B8">
          <span style="font-size:14px; font-weight:700; color:#B37200">ادمین</span>
          <span style="width:38px; height:38px; border-radius:11px; background:#DCE1E4; border:2px solid #F8B000; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#5D6E79; white-space:nowrap">ا</span>
        </span>

      </div>
    </div>

    <div style="border-top:1px solid #DCE1E4">
      <div style="max-width:1440px; margin:0 auto; padding:0 26px; display:flex; align-items:center; gap:4px; flex-wrap:wrap">
        <a href="#" style="font-size:14px; font-weight:700; color:#B37200; padding:15px 14px; border-bottom:2.5px solid #F8B000; white-space:nowrap">همسرانه</a>
        <a href="#" style="font-size:14px; font-weight:600; color:#3E4950; padding:15px 14px; border-bottom:2.5px solid transparent; white-space:nowrap" style-hover="color:#D68800; border-bottom-color:#FFD270">رشد فردی</a>
        <a href="#" style="font-size:14px; font-weight:600; color:#3E4950; padding:15px 14px; border-bottom:2.5px solid transparent; white-space:nowrap" style-hover="color:#D68800; border-bottom-color:#FFD270">استعدادیابی</a>
        <a href="#" style="font-size:14px; font-weight:600; color:#3E4950; padding:15px 14px; border-bottom:2.5px solid transparent; white-space:nowrap" style-hover="color:#D68800; border-bottom-color:#FFD270">فرزندپروری</a>
        <a href="#" style="font-size:14px; font-weight:600; color:#3E4950; padding:15px 14px; border-bottom:2.5px solid transparent; white-space:nowrap" style-hover="color:#D68800; border-bottom-color:#FFD270">مهارت‌های زندگی</a>
        <a href="#" style="font-size:14px; font-weight:600; color:#3E4950; padding:15px 14px; border-bottom:2.5px solid transparent; white-space:nowrap" style-hover="color:#D68800; border-bottom-color:#FFD270">کتابخانه</a>
        <a href="#" style="font-size:14px; font-weight:600; color:#3E4950; padding:15px 14px; border-bottom:2.5px solid transparent; white-space:nowrap" style-hover="color:#D68800; border-bottom-color:#FFD270">کارگاه‌های حضوری</a>
        <a href="#" style="font-size:14px; font-weight:600; color:#3E4950; padding:15px 14px; border-bottom:2.5px solid transparent; white-space:nowrap" style-hover="color:#D68800; border-bottom-color:#FFD270">پادکست</a>
        <span style="flex:1"></span>
        <a href="tel:09123456789" style="display:flex; align-items:center; gap:11px; margin:6px 0; padding:5px 5px 5px 16px; background:#FFF8E8; border:1px solid #FFE3A3; border-radius:14px; white-space:nowrap; transition:all .2s" style-hover="background:#FFEFC8; border-color:#F8B000; box-shadow:0 6px 16px -8px rgba(214,136,0,.45)">
          <span style="width:36px; height:36px; border-radius:10px; background:#F8B000; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px -4px rgba(214,136,0,.6)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
          </span>
          <span style="display:flex; flex-direction:column; gap:1px; line-height:1.2">
            <span style="font-size:11px; font-weight:500; color:#8A6A2A">مشاوره و پشتیبانی</span>
            <span style="font-size:16px; font-weight:800; color:#3E4950; letter-spacing:0.6px">۰۲۱-۱۲۳۴۵۶۷۸</span>
          </span>
        </a>
      </div>
    </div>
  </header>

  <div style="max-width:1440px; margin:0 auto; padding:26px; display:flex; flex-direction:column; gap:10px">
    <div style="font-size:13px; color:#5D6E79">نمای هدر با پالت نهایی — رنگ اصلی #F8B000، متن #3E4950، حاشیه #DCE1E4.</div>
  </div>
</div>
</x-dc>
</body>
</html>
